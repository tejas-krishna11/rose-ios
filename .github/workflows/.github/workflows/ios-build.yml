
name: Rose iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Rose for iOS
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Rose source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh Release

      - name: Upload Rose IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rose-iOS-unsigned-IPA
          path: build/Rose.ipa
          if-no-files-found: error
          retention-days: 14
